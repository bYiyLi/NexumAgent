version: '3'
info:
  companyName: Nexum
  productName: Nexum Desktop Dev
  productIdentifier: com.nexum.desktop.dev
  description: Nexum Agent management client (development)
  version: '0.1.0'
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - .tools
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task build:hot
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
      readiness:
        http: "http://127.0.0.1:9245/"
        timeout: "60s"
        interval: "200ms"
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
