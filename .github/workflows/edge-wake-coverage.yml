name: Isolated expanded Edge native coverage
on:
  push:
    branches: [codex/phase-48-edge-wake]
    paths: [.github/workflows/edge-wake-coverage.yml]
permissions:
  contents: read
jobs:
  edge:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-extension-api.mjs
      - run: pnpm --dir packages/browser install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir packages/browser build
      - name: Select macOS runner Edge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          edge='/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge'
          test -x "$edge"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' '/Applications/Microsoft Edge.app/Contents/Info.plist'
          shasum -a 256 "$edge"
          printf 'NEXUM_BROWSER_NATIVE_BINARY=%s\n' "$edge" >> "$GITHUB_ENV"
      - name: Select Windows runner Edge
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $edge) { throw 'Runner Microsoft Edge was not found.' }
          (Get-Item $edge).VersionInfo.ProductVersion
          Get-FileHash -Algorithm SHA256 $edge
          "NEXUM_BROWSER_NATIVE_BINARY=$edge" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Confirm actual Edge prerequisites
        run: node --experimental-vm-modules --test --test-timeout=120000 --test-name-pattern="native capability revisions" packages/browser/test/native-capabilities.acceptance.mjs
      - name: Exercise the isolated native Edge scenarios
        run: node --experimental-vm-modules --test --test-timeout=120000 --test-concurrency=1 --test-skip-pattern="native capability revisions" packages/browser/test/native.acceptance.mjs packages/browser/test/native-actions.acceptance.mjs packages/browser/test/native-capabilities.acceptance.mjs packages/browser/test/native-client.acceptance.mjs packages/browser/test/native-visual.acceptance.mjs
