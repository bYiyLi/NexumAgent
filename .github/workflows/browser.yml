name: Phase 48 browser download records
on:
  push:
    branches: [codex/phase48-download-resource-17bc4856]
permissions:
  contents: read
jobs:
  browser-downloads:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-extension-api.mjs
      - run: pnpm --dir packages/browser install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir packages/browser build
      - name: Verify list and path authorization
        run: node --experimental-vm-modules --test --test-name-pattern="browser download listing|browser downloads list includes|browser download records are not filtered" packages/browser/test/client.test.mjs packages/browser/test/mv3-router.test.mjs packages/browser/test/runtime.test.mjs
      - run: node scripts/prepare-native-browser.mjs
      - name: Verify actual browser download records and MCP resources
        run: node --experimental-vm-modules --test --test-concurrency=1 --test-name-pattern="native browser download records expose" packages/browser/test/native-actions.acceptance.mjs
