name: Optional browser package
on:
  workflow_dispatch:
  push:
    paths:
      - packages/browser/**
      - packages/extension-api/**
      - scripts/build-extension-api.mjs
      - scripts/prepare-native-browser.mjs
      - scripts/service.mjs
      - src/extension-api.ts
      - .github/workflows/browser.yml
  pull_request:
    paths:
      - packages/browser/**
      - packages/extension-api/**
      - scripts/build-extension-api.mjs
      - scripts/prepare-native-browser.mjs
      - scripts/service.mjs
      - src/extension-api.ts
      - .github/workflows/browser.yml
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-extension-api.mjs
      - run: pnpm --dir packages/browser install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir packages/browser typecheck
      - run: pnpm --dir packages/browser build
      - run: node --experimental-vm-modules --test --test-timeout=120000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=../../scripts/ci-test-events.mjs --test-reporter-destination=stdout "test/*.test.mjs"
        working-directory: packages/browser
      - run: pnpm --dir packages/browser pack --pack-destination "${{ runner.temp }}/browser-package"
      - name: Prepare the SHA-256-pinned native Chrome for Testing in runner temp
        run: node scripts/prepare-native-browser.mjs
      - name: Confirm native page and extension prerequisites
        run: node --experimental-vm-modules --test --test-name-pattern="native capability revisions" packages/browser/test/native-capabilities.acceptance.mjs
      - name: Exercise actual isolated browser scenarios
        run: node --experimental-vm-modules --test --test-concurrency=1 --test-skip-pattern="native capability revisions" packages/browser/test/native.acceptance.mjs packages/browser/test/native-actions.acceptance.mjs packages/browser/test/native-capabilities.acceptance.mjs packages/browser/test/native-client.acceptance.mjs packages/browser/test/native-visual.acceptance.mjs
      - name: Exercise real opt-in WebMCP registrations and stale-registration rejection
        env:
          NEXUM_BROWSER_WEBMCP_TESTING: "1"
        run: node --experimental-vm-modules --test --test-name-pattern="native WebMCP" packages/browser/test/native-capabilities.acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexum-browser-native-${{ matrix.os }}
          path: ${{ runner.temp }}/nexum-browser-native-*/receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nexum-browser-${{ matrix.os }}-candidate
          path: ${{ runner.temp }}/browser-package/*.tgz
          retention-days: 7
