name: Phase 48 download verification
on:
  push:
    branches: ['codex/phase48-download-resource-17bc4856']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-extension-api.mjs
      - run: pnpm --dir packages/browser install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir packages/browser build
      - run: node scripts/prepare-native-browser.mjs
      - name: Verify actual download and MCP resource in an isolated profile
        run: node --experimental-vm-modules --test --test-concurrency=1 --test-name-pattern='native MV3 provides page interaction, MCP JPEG and an actual downloaded MCP resource|native direct file refs, owned download aliases' packages/browser/test/native.acceptance.mjs packages/browser/test/native-actions.acceptance.mjs
