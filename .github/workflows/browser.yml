name: Phase 48 download verification
on:
  push:
    branches: ['codex/phase48-download-resource-17bc4856']
permissions:
  contents: read
jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-extension-api.mjs
      - run: pnpm --dir packages/browser install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir packages/browser build
      - name: Verify download identity and cleanup
        run: node --experimental-vm-modules --test --test-name-pattern='awaited attachment|duplicated marked identity|same-URL native download|existing raw Fetch|uncertain download interception|in-flight local-download watcher|data URL body' packages/browser/test/mv3-router.test.mjs
      - run: node scripts/prepare-native-browser.mjs
      - name: Verify actual download and MCP resource in an isolated profile
        run: node --experimental-vm-modules --test --test-concurrency=1 --test-name-pattern='native MV3 provides page interaction, MCP JPEG and an actual downloaded MCP resource|native direct file refs, owned download aliases|native same-URL download in another tab|native download started before a new wait|native Blob download keeps its identity and becomes an MCP resource|native data URL download keeps its identity and becomes an MCP resource' packages/browser/test/native.acceptance.mjs packages/browser/test/native-actions.acceptance.mjs
