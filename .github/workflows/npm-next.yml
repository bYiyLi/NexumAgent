name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_auth:
        description: "Publish authentication: token (current) or OIDC (trusted-publisher verification)"
        required: true
        type: choice
        default: token
        options:
          - token
          - oidc

permissions:
  contents: read
  id-token: write

concurrency:
  group: nexum-agent-npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'bYiyLi/NexumAgent' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - run: pnpm install --frozen-lockfile
      - name: Determine version from tag or manual run
        run: node scripts/npm-release.mjs prepare
      - name: Check Agent runtime and SDK contract
        run: pnpm check
      - name: Build optional Browser and check its package
        run: |
          node scripts/build-extension-api.mjs
          pnpm --dir packages/browser install --ignore-workspace --frozen-lockfile
          pnpm --dir packages/browser check
      - name: Verify all three npm archives
        run: node scripts/npm-release.mjs verify
      - name: Publish SDK, Agent and Browser with migration token
        if: github.event_name == 'push' || inputs.publish_auth == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: node scripts/npm-release.mjs publish
      - name: Verify no npm token is provided for OIDC
        if: github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'oidc'
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "OIDC publishing must not use NODE_AUTH_TOKEN"
            exit 1
          fi
      - name: Publish SDK, Agent and Browser with npm OIDC
        if: github.event_name == 'workflow_dispatch' && inputs.publish_auth == 'oidc'
        run: node scripts/npm-release.mjs publish
