name: Isolated native Linux Edge coverage
on:
  push:
    branches: [codex/phase-48-edge-coverage]
    paths: [.github/workflows/edge-linux.yml]
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/build-extension-api.mjs
      - run: pnpm --dir packages/browser install --ignore-workspace --frozen-lockfile
      - run: pnpm --dir packages/browser build
      - name: Select Linux runner Edge
        shell: bash
        run: |
          edge="$(command -v microsoft-edge-stable || command -v microsoft-edge)"
          test -x "$edge"
          "$edge" --version
          resolved="$(readlink -f "$edge")"
          file "$resolved"
          sha256sum "$resolved"
          ls -l /opt/microsoft/msedge/msedge-sandbox
          edge_root="$(mktemp -d "$RUNNER_TEMP/nexum-edge.XXXXXXXX")"
          cp -R /opt/microsoft/msedge "$edge_root/app"
          test -f "$edge_root/app/msedge-sandbox" && test ! -L "$edge_root/app/msedge-sandbox"
          cmp /opt/microsoft/msedge/msedge "$edge_root/app/msedge"
          cmp /opt/microsoft/msedge/msedge-sandbox "$edge_root/app/msedge-sandbox"
          sudo --non-interactive chown root:root "$edge_root/app/msedge-sandbox"
          sudo --non-interactive chmod 4755 "$edge_root/app/msedge-sandbox"
          sha256sum "$edge_root/app/msedge"
          ls -l "$edge_root/app/msedge-sandbox"
          printf 'NEXUM_BROWSER_NATIVE_BINARY=%s\n' "$edge_root/app/msedge" >> "$GITHUB_ENV"
      - name: Confirm actual Edge prerequisites
        run: node --experimental-vm-modules --test --test-timeout=120000 --test-name-pattern="native capability revisions" packages/browser/test/native-capabilities.acceptance.mjs
      - name: Exercise the isolated native Edge scenarios
        run: node --experimental-vm-modules --test --test-timeout=120000 --test-concurrency=1 --test-skip-pattern="native capability revisions" packages/browser/test/native.acceptance.mjs packages/browser/test/native-actions.acceptance.mjs packages/browser/test/native-capabilities.acceptance.mjs packages/browser/test/native-client.acceptance.mjs packages/browser/test/native-visual.acceptance.mjs
