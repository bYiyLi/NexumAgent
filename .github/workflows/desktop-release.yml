name: Publish Desktop

on:
  push:
    tags:
      - "desktop/v*"
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: "Failed Development release run with all four native builds successful"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.recovery_run_id || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.repository == 'bYiyLi/NexumAgent'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      profile: ${{ steps.plan.outputs.profile }}
      sign: ${{ steps.plan.outputs.sign }}
      tag: ${{ steps.plan.outputs.tag }}
      source_run_id: ${{ steps.plan.outputs.source_run_id }}
      recovery: ${{ steps.plan.outputs.recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          source_run_id="$GITHUB_RUN_ID"
          recovery=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            source_run_id="$RECOVERY_RUN_ID"
            recovery=true
            run=$(gh api "repos/$GH_REPO/actions/runs/$source_run_id")
            jq -e --arg repo "$GH_REPO" --arg id "$source_run_id" '
              (.id|tostring) == $id and .repository.full_name == $repo and .head_repository.full_name == $repo
              and .path == ".github/workflows/desktop-release.yml" and .event == "push"
              and .status == "completed" and .conclusion == "failure"
            ' <<< "$run" >/dev/null
            tag=$(jq -er .head_branch <<< "$run")
          fi
          if [[ ! "$tag" =~ ^desktop/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid Desktop release tag"; exit 1
          fi
          version="${tag#desktop/v}"
          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$commit" origin/main
          if [ "$recovery" = true ]; then
            [[ "$version" == *-* ]] || { echo "Recovery is Development-only"; exit 1; }
            test "$commit" = "$(jq -er .head_sha <<< "$run")"
            gh api "repos/$GH_REPO/actions/runs/$source_run_id/jobs?filter=latest&per_page=100" | jq -e '
              .total_count == 6 and ([.jobs[] | select(.status=="completed" and .conclusion=="success") | .name] | sort) ==
              (["plan","build / build (macos-26, darwin, arm64)","build / build (macos-26-intel, darwin, amd64)","build / build (windows-2025, windows, amd64)","build / build (windows-11-arm, windows, arm64)"] | sort)
              and ([.jobs[] | select(.name=="publish" and .status=="completed" and .conclusion=="failure")] | length) == 1
            ' >/dev/null
            gh api "repos/$GH_REPO/actions/runs/$source_run_id/artifacts?per_page=100" | jq -e --arg id "$source_run_id" --arg sha "$commit" --arg tag "$tag" '
              .total_count == 4 and ([.artifacts[].name]|sort) == ["desktop-darwin-amd64","desktop-darwin-arm64","desktop-windows-amd64","desktop-windows-arm64"]
              and all(.artifacts[]; .expired==false and (.digest|test("^sha256:[a-f0-9]{64}$")) and (.workflow_run.id|tostring)==$id and .workflow_run.head_sha==$sha and .workflow_run.head_branch==$tag)
            ' >/dev/null
            echo "Recovery validated: $tag from run $source_run_id ($commit)"
          else
            test "$commit" = "$(git rev-parse HEAD)"
          fi
          printf 'version=%s\ntag=%s\nsource_run_id=%s\nrecovery=%s\n' "$version" "$tag" "$source_run_id" "$recovery" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            printf 'profile=development\nsign=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'profile=production\nsign=true\n' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: plan
    if: needs.plan.outputs.recovery != 'true'
    uses: ./.github/workflows/desktop-ci.yml
    with:
      profile: ${{ needs.plan.outputs.profile }}
      version: ${{ needs.plan.outputs.version }}
      sign: ${{ needs.plan.outputs.sign == 'true' }}
    secrets: inherit
  publish:
    needs: [plan, build]
    if: "!cancelled() && needs.plan.result == 'success' && (needs.build.result == 'success' || (needs.plan.outputs.recovery == 'true' && needs.build.result == 'skipped'))"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - run: node --test desktop/scripts/prepare-release.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/nexum-desktop-native-artifacts
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run_id }}
      - name: Verify complete package set and create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PROFILE: ${{ needs.plan.outputs.profile }}
          NEXUM_UPDATE_PUBLIC_KEY: ${{ vars[format('NEXUM_DESKTOP_UPDATE_PUBLIC_KEY_{0}', needs.plan.outputs.profile == 'production' && 'PRODUCTION' || 'DEVELOPMENT')] }}
          NEXUM_UPDATE_PRIVATE_KEY: ${{ secrets[format('NEXUM_DESKTOP_UPDATE_PRIVATE_KEY_{0}', needs.plan.outputs.profile == 'production' && 'PRODUCTION' || 'DEVELOPMENT')] }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/desktop/scripts/prepare-release.mjs" "$RUNNER_TEMP/nexum-desktop-native-artifacts" "$RUNNER_TEMP/nexum-desktop-release-packages"
          cd "$RUNNER_TEMP/nexum-desktop-release-packages"
          prefix=NexumDesktop
          flags=()
          if [ "$PROFILE" = development ]; then
            prefix=NexumDesktopDev
            flags+=(--prerelease)
          fi
          files=()
          for arch in arm64 amd64; do
            files+=("$prefix-$VERSION-darwin-$arch.dmg" "$prefix-$VERSION-windows-$arch-installer.exe")
          done
          assets=()
          for file in "${files[@]}"; do
            test -f "$file"
            test -f "$file.sha256"
            test -f "$file.metadata.json"
            sha256sum -c "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 12
          node "$GITHUB_WORKSPACE/desktop/scripts/sign-update.mjs"
          assets+=("update.json" "update.json.sig")
          # Creating a draft first ensures failed uploads do not become a public release.
          # Never overwrite an existing release or its assets.
          gh release create "$TAG" "${assets[@]}" --verify-tag --draft --latest=false "${flags[@]}" --title "Nexum Desktop $VERSION" --notes "Profile: $PROFILE. Prereleases are development builds; stable releases require verified signing."
          gh release edit "$TAG" --draft=false --latest=false
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets
